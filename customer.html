<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambil Antrian - Photobooth</title>
    <meta name="description" content="Ambil tiket antrian Photobooth Mediatech An-Nur II secara online.">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="shared/tailwind-config.js"></script>
    <link rel="stylesheet" href="shared/styles.css">
</head>

<body class="flex flex-col p-4 md:p-8 max-w-md mx-auto relative min-h-screen pb-20">

    <!-- TOAST CONTAINER -->
    <div id="toast-container"
        class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-3 w-[90%] max-w-sm pointer-events-none">
    </div>

    <!-- CUSTOM POPUP MODAL -->
    <div id="custom-popup"
        class="fixed inset-0 bg-black/60 backdrop-blur-[2px] z-[100] flex items-center justify-center p-4 hidden transition-opacity duration-200">
        <div class="bg-white border-4 border-black shadow-[8px_8px_0px_0px_#000] p-6 max-w-sm w-full transform transition-all duration-300 scale-95 opacity-0"
            id="popup-content">
            <h2 id="popup-title"
                class="text-xl font-black uppercase tracking-tight border-b-4 border-black pb-1 mb-4 inline-block pr-4">
                Perhatian</h2>
            <div id="popup-body" class="font-bold mb-6 text-sm leading-relaxed"></div>
            <button onclick="closePopup()"
                class="w-full bg-neoCyan text-black font-black uppercase py-3 border-4 border-black shadow-[4px_4px_0px_0px_#000] hover:-translate-y-1 hover:shadow-[2px_2px_0px_0px_#000] active:translate-y-1 active:shadow-none transition-all">Tutup</button>
        </div>
    </div>

    <!-- Load shared modules -->
    <script src="shared/config.js"></script>

    <!-- SECTION 1: PILIH BACKGROUND -->
    <div id="selection-section"
        class="flex-1 flex flex-col neo-card bg-white p-0 overflow-hidden w-full relative shadow-[8px_8px_0px_0px_#000]">

        <div
            class="w-full p-4 border-b-4 border-black bg-neoYellow text-black text-center shadow-[0px_4px_0px_0px_#000] z-10 relative flex flex-col items-center justify-center gap-1">
            <div class="flex items-center justify-center gap-2">
                <img src="logo-mm.png" alt="Logo" class="h-6">
                <span class="font-black text-xs uppercase tracking-widest text-left leading-none">Mediatech<br>An-Nur
                    II</span>
            </div>
            <h1 class="text-3xl md:text-4xl font-black uppercase tracking-tighter mt-2">Tiket Antrian</h1>
        </div>

        <div class="p-6 flex-1 flex flex-col relative z-0">

            <div class="text-center mb-6">
                <p class="font-mono font-bold border-b-2 border-black inline-block px-2 text-sm uppercase">Pendaftaran
                    Photobooth</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="font-mono text-sm font-bold uppercase block mb-2 text-gray-700">
                        Nama Lengkap
                        <span id="prefix-indicator"
                            class="float-right bg-black text-white px-2 py-0.5 text-[10px] rounded-sm">KODE: PB</span>
                    </label>
                    <input type="text" id="input-nama"
                        class="w-full border-2 border-black p-4 text-lg font-bold bg-white focus:outline-none focus:ring-4 focus:ring-neoCyan transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] focus:translate-y-[2px]"
                        placeholder="Contoh: Budi Santoso">
                </div>
                <div>
                    <label class="font-mono text-sm font-bold uppercase block mb-2 text-gray-700">Kelas</label>
                    <input type="text" id="input-kelas"
                        class="w-full border-2 border-black p-4 text-lg font-bold bg-white focus:outline-none focus:ring-4 focus:ring-neoCyan transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] focus:translate-y-[2px]"
                        placeholder="Contoh: 12 IPA 1">
                </div>
                <div>
                    <label class="font-mono text-sm font-bold uppercase block mb-2 text-gray-700">Alamat</label>
                    <input type="text" id="input-alamat"
                        class="w-full border-2 border-black p-4 text-lg font-bold bg-white focus:outline-none focus:ring-4 focus:ring-neoCyan transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] focus:translate-y-[2px]"
                        placeholder="Contoh: Malang">
                </div>
            </div>

            <div class="flex items-center gap-4 my-8">
                <div class="h-1 flex-1 bg-black"></div>
                <div
                    class="font-mono text-xs font-bold uppercase bg-black text-white px-3 py-1 tracking-widest shadow-[2px_2px_0px_0px_#f9a8d4]">
                    PILIH BACKGROUND</div>
                <div class="h-1 flex-1 bg-black"></div>
            </div>

            <p class="text-center font-bold font-mono text-sm mb-4 uppercase text-gray-700">Foto berukuran 10R</p>

            <div id="loading-bgs"
                class="font-mono text-center font-bold text-gray-500 p-4 border-2 border-black border-dashed">MEMUAT
                PILIHAN...</div>

            <div id="bg-list" class="space-y-4">
                <!-- Rendered via JS -->
            </div>

            <button onclick="submitQueue()"
                class="w-full mt-10 bg-neoCyan text-black hover:bg-black hover:text-white font-black py-5 uppercase tracking-widest text-xl border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:translate-y-[4px] transition-all">
                AMBIL TIKET
            </button>

            <!-- LACAK TIKET -->
            <div class="mt-8 p-0 border-4 border-black bg-white overflow-hidden shadow-[6px_6px_0px_0px_#000]">
                <div class="bg-neoYellow border-b-4 border-black p-3 shadow-[0px_4px_0px_0px_#000] z-10 relative">
                    <h3 class="font-black uppercase tracking-tight text-xl flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        Cari Tiket
                    </h3>
                </div>
                <div class="p-5">
                    <p class="text-sm font-bold text-black mb-4 text-center">Lupa nomor tiket? Masukkan Nama atau Nomor
                        Tiket untuk melacak.</p>
                    <div class="flex flex-col gap-2">
                        <input type="text" id="input-lacak"
                            class="flex-1 border-4 border-black p-3 font-bold bg-white focus:outline-none focus:ring-4 focus:ring-neoCyan transition-all text-center"
                            placeholder="PB-...">
                        <button onclick="lacakTiket()"
                            class="bg-black text-white font-black uppercase px-6 py-3 hover:bg-neoCyan hover:text-black transition-colors border-4 border-black shadow-[4px_4px_0px_0px_#000] hover:-translate-y-1 hover:shadow-[6px_6px_0px_0px_#000]">Lacak</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- SECTION 2: TIKET ANTRIAN -->
    <div id="ticket-section" class="flex-1 flex flex-col hidden mt-2">
        <div class="neo-card bg-white p-0 mb-6 relative transition-colors duration-300 overflow-hidden w-full shadow-[8px_8px_0px_0px_#000]"
            id="ticket-card">

            <div
                class="w-full p-4 border-b-4 border-black bg-neoCyan text-black text-center shadow-[0px_4px_0px_0px_#000] z-10 relative flex flex-col items-center justify-center gap-1 mb-6">
                <div class="flex items-center justify-center gap-2">
                    <img src="logo-mm.png" alt="Logo" class="h-6">
                    <span
                        class="font-black uppercase tracking-widest text-xs text-left leading-none">Mediatech<br>An-Nur
                        II</span>
                </div>
            </div>

            <div class="text-center pb-4">
                <p class="font-mono text-sm font-bold uppercase bg-black text-white border-2 border-black inline-block px-3 py-1 mb-4 shadow-[4px_4px_0px_0px_#000] break-words whitespace-normal max-w-[90%]"
                    id="ticket-user-info">--</p>
                <div class="text-6xl md:text-7xl font-black tracking-tighter text-black mb-2" id="ticket-number">--
                </div>
            </div>

            <!-- TOTAL HARGA DI TIKET -->
            <div class="mx-6 mb-4 p-4 bg-neoYellow border-4 border-black shadow-[4px_4px_0px_0px_#000] text-center">
                <div class="font-mono text-xs font-bold uppercase tracking-widest mb-1">Total Pembayaran</div>
                <div id="ticket-total-price" class="text-3xl font-black tracking-tight">Rp 0</div>
                <div id="ticket-total-qty" class="font-mono text-xs font-bold mt-1 text-gray-700">0 foto</div>
            </div>

            <div class="h-1 w-full bg-black my-4"></div>

            <div
                class="font-mono text-xs font-bold uppercase bg-black text-white px-2 py-1 tracking-widest inline-block mx-auto text-center mb-4 border-2 border-black shadow-[2px_2px_0px_0px_#fde047]">
                STATUS BACKGROUND</div>

            <div id="ticket-items" class="space-y-4 text-left mt-2 px-6 pb-6">
                <!-- Rendered via JS -->
            </div>

        </div>

        <button onclick="downloadTicketImage()"
            class="w-full mt-2 bg-neoGreen text-black border-4 border-black hover:bg-black hover:text-white transition-colors font-black py-4 uppercase tracking-widest text-lg shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:shadow-none hover:translate-y-[6px]">
            DOWNLOAD TIKET
        </button>

        <button onclick="resetApp()"
            class="w-full mt-2 bg-neoCyan text-black border-4 border-black hover:bg-black hover:text-white transition-colors font-black py-4 uppercase tracking-widest text-lg shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:shadow-none hover:translate-y-[6px]">
            BUAT ANTRIAN BARU
        </button>
    </div>

    <!-- Load page-specific logic -->
    <script src="js/customer.js"></script>
</body>

</html>
