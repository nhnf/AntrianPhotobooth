<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrian Photobooth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgLight: '#f4f4f5', 
                        neoYellow: '#fde047',
                        neoCyan: '#67e8f9',
                        neoPink: '#f9a8d4',
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['Space Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: var(--tw-colors-bgLight, #f4f4f5);
            color: #000;
            background-image: radial-gradient(#000 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .neo-button {
            border: 3px solid #000;
            box-shadow: 6px 6px 0px 0px #000;
            transition: all 0.1s ease-in-out;
        }
        .neo-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px 0px #000;
        }
        .neo-button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px #000;
        }
        .neo-card {
            background-color: #fff;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px 0px #000;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="neo-card p-8 text-center max-w-sm w-[90%] mx-auto relative">
        <div class="flex items-center justify-center gap-3 mb-6 opacity-80">
            <img src="logo-mm.png" alt="Logo" class="h-8">
            <span class="font-black text-sm uppercase leading-tight text-left tracking-widest">Mediatech<br>An-Nur II</span>
        </div>
        
        <!-- Decorative tape element -->
        <div class="absolute -top-4 -right-4 w-16 h-8 bg-neoYellow border-2 border-black rotate-12 z-10 hidden sm:block"></div>
        
        <div class="space-y-2">
            <h1 class="text-4xl font-bold tracking-tighter uppercase">Photobooth<br><span class="text-neoPink bg-black text-white px-2 mt-1 inline-block">App</span></h1>
            <p class="font-mono text-sm font-bold border-b-2 border-black pb-2 inline-block">PILIH AKSES PORTAL</p>
        </div>

        <div class="space-y-4">
            <a href="customer.html" class="neo-button block w-full py-4 px-6 bg-neoCyan font-bold text-lg uppercase tracking-wide">
                🧑‍🦱 Halaman Pelanggan
                <span class="block font-mono text-xs font-normal mt-1 lowercase border-t border-black/30 pt-1">scan qr / ambil antrian</span>
            </a>

            <a href="admin.html" class="neo-button block w-full py-4 px-6 bg-neoYellow font-bold text-lg uppercase tracking-wide">
                👨‍💻 Dashboard Admin
                <span class="block font-mono text-xs font-normal mt-1 lowercase border-t border-black/30 pt-1">panggil & kelola antrian</span>
            </a>

            <a href="monitor.html" class="neo-button block w-full py-4 px-6 bg-neoPink font-bold text-lg uppercase tracking-wide">
                📺 Monitor Layar
                <span class="block font-mono text-xs font-normal mt-1 lowercase border-t border-black/30 pt-1">tampilan publik (tv)</span>
            </a>
        </div>
    </div>

</body>
</html>
