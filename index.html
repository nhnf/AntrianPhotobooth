<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrian Photobooth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgLight: '#e4e4e7',
                        neoYellow: '#fde047',
                        neoCyan: '#67e8f9',
                        neoPink: '#f9a8d4',
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['Space Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: var(--tw-colors-bgLight, #e4e4e7);
            color: #000;
            background-image: radial-gradient(#000 2px, transparent 2px);
            background-size: 30px 30px;
        }

        .neo-button {
            border: 4px solid #000;
            box-shadow: 6px 6px 0px 0px #000;
            transition: all 0.1s ease-in-out;
        }

        .neo-button:hover {
            transform: translate(-4px, -4px);
            box-shadow: 10px 10px 0px 0px #000;
        }

        .neo-button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px #000;
        }

        .neo-card {
            background-color: #fff;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px 0px #000;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">
    <div class="neo-card p-0 text-center max-w-sm w-full mx-auto relative bg-white flex flex-col overflow-hidden">

        <!-- Top Banner -->
        <div
            class="w-full p-4 border-b-4 border-black bg-neoCyan text-black text-center shadow-[0px_4px_0px_0px_#000] z-10 relative">
            <div class="flex items-center justify-center gap-2 mb-1">
                <img src="logo-mm.png" alt="Logo" class="h-6">
                <span class="font-black text-xs uppercase leading-none tracking-widest text-left">Mediatech<br>An-Nur
                    II</span>
            </div>
            <h1 class="text-4xl font-black uppercase mt-2 tracking-tighter">Sistem Antrian <br> Photobooth</h1>
        </div>

        <div class="p-6 space-y-4 relative z-0">
            <!-- Decorative tape element -->
            <div
                class="absolute -top-4 -right-4 w-16 h-8 bg-neoYellow border-4 border-black rotate-12 z-20 hidden sm:block">
            </div>

            <p class="font-mono text-sm font-bold border-b-2 border-black pb-2 inline-block mx-auto">PILIH AKSES PORTAL
            </p>

            <a href="customer.html"
                class="neo-button block w-full py-4 px-6 bg-neoCyan font-black text-lg uppercase tracking-wide">
                Halaman Pelanggan
                <span class="block font-mono text-xs font-bold mt-1 lowercase border-t-2 border-black/30 pt-1">
                    ambil antrian</span>
            </a>

            <a href="admin.html"
                class="neo-button block w-full py-4 px-6 bg-neoYellow font-black text-lg uppercase tracking-wide">
                Dashboard Admin
                <span class="block font-mono text-xs font-bold mt-1 lowercase border-t-2 border-black/30 pt-1">panggil &
                    kelola antrian</span>
            </a>

            <a href="monitor.html"
                class="neo-button block w-full py-4 px-6 bg-neoPink font-black text-lg uppercase tracking-wide">
                Monitor Layar
                <span
                    class="block font-mono text-xs font-normal mt-1 lowercase border-t-2 border-black/30 pt-1">tampilan
                    publik (tv)</span>
            </a>
        </div>
    </div>

</body>

</html>
