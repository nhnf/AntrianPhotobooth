<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Antrian - Photobooth</title>
    <meta name="description" content="Monitor tampilan publik antrian Photobooth Mediatech An-Nur II untuk layar TV.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="shared/tailwind-config.js"></script>
    <link rel="stylesheet" href="shared/styles.css">
</head>

<body class="flex flex-col min-h-screen lg:h-screen lg:overflow-hidden">

    <!-- Load shared modules -->
    <script src="shared/config.js"></script>

    <!-- HEADER -->
    <header
        class="p-3 md:p-4 flex justify-between items-center border-b-4 border-black bg-white shrink-0 shadow-[0px_4px_0px_0px_#000] z-20">
        <div class="flex items-center gap-3 md:gap-4">
            <img src="logo-mm.png" alt="Logo" class="h-8 md:h-12 hidden sm:block">
            <div>
                <h1
                    class="text-2xl md:text-4xl font-black uppercase tracking-tighter leading-none flex items-center gap-2 text-black">
                    <img src="logo-mm.png" alt="Logo" class="h-6 sm:hidden">
                    Status Antrian
                </h1>
                <p
                    class="font-mono text-[10px] md:text-sm font-bold text-black bg-neoYellow border-2 border-black px-1 inline-block uppercase mt-0.5">
                    Photobooth Mediatech An-Nur II</p>
            </div>
        </div>
        <div id="clock"
            class="font-mono text-xl md:text-3xl font-bold tracking-widest bg-black text-white px-3 py-1 border-2 border-black shadow-[2px_2px_0px_0px_var(--tw-colors-neoPink)]">
            00:00</div>
    </header>

    <!-- MAIN CONTENT -->
    <main
        class="flex-1 w-full max-w-[1920px] mx-auto p-4 md:p-8 z-10 flex flex-col lg:flex-row items-stretch justify-center gap-6 md:gap-8 lg:overflow-hidden">

        <!-- BACKGROUNDS GRID -->
        <div id="monitor-columns"
            class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8 items-stretch flex-1 w-full h-full overflow-y-auto lg:overflow-hidden">
            <!-- Rendered via JS -->
        </div>

        <!-- DELAYED SIDEBAR -->
        <div id="delayed-container"
            class="hidden w-full lg:w-[200px] xl:w-[240px] flex-shrink-0 flex flex-col bg-neoYellow border-4 border-black p-0 h-48 lg:h-full lg:max-h-full overflow-hidden shadow-[4px_4px_0px_0px_#000]">
            <div
                class="bg-black text-white font-black uppercase p-2 text-base xl:text-lg text-center border-b-4 border-black tracking-wider">
                DITUNDA
            </div>
            <div
                class="bg-white border-b-4 border-black font-bold uppercase p-1.5 text-[0.65rem] xl:text-xs text-center shadow-[0px_4px_0px_0px_#000] z-10 leading-tight">
                Lapor petugas
            </div>
            <div class="flex-1 overflow-hidden relative bg-bgLight">
                <div class="absolute inset-0 p-3 overflow-y-auto space-y-2" id="delayed-list-content">
                    <!-- JS fills this -->
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer
        class="p-2 text-center border-t-4 border-black font-mono font-bold bg-white text-xs md:text-sm uppercase tracking-wider shadow-[0px_-4px_0px_0px_#000] z-20 mt-auto flex-shrink-0">
        Harap tetap memantau antrian Anda, baik di HP maupun di monitor, agar tidak terlewat. apabila terlewat harap
        menuju ke petugas.
    </footer>

    <!-- Load page-specific logic -->
    <script src="js/monitor.js"></script>
</body>

</html>
