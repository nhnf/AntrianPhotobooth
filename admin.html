<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Photobooth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgLight: '#f4f4f5', 
                        neoYellow: '#fde047',
                        neoCyan: '#67e8f9',
                        neoPink: '#f9a8d4',
                        neoGreen: '#86efac',
                        neoRed: '#fca5a5'
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['Space Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: var(--tw-colors-bgLight, #f4f4f5);
            color: #000;
            background-image: radial-gradient(#000 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .neo-button {
            border: 3px solid #000;
            box-shadow: 4px 4px 0px 0px #000;
            transition: all 0.1s ease-in-out;
        }
        .neo-button:hover:not(:disabled) {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px #000;
        }
        .neo-button:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px #000;
        }
        .neo-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #e5e7eb !important;
            box-shadow: 2px 2px 0px 0px #000;
            transform: none;
        }
        .neo-card {
            background-color: #fff;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px 0px #000;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fff; border-left: 2px solid #000; }
        ::-webkit-scrollbar-thumb { background: #000; border-radius: 0; }
    </style>
</head>
<body class="flex flex-col p-4 md:p-8 min-h-screen">

    <script src="shared/config.js"></script>

    <!-- HEADER -->
    <header class="p-3 md:p-4 flex flex-col md:flex-row justify-between items-center border-b-4 border-black bg-white mb-6 gap-3">
        <div class="flex items-center gap-3">
            <img src="logo-mm.png" alt="Logo" class="h-8 md:h-10">
            <div>
                <h1 class="text-2xl md:text-3xl font-black uppercase tracking-tighter leading-none">
                    Admin<span class="bg-black text-white px-2 ml-1 inline-block">Control</span>
                </h1>
                <p class="font-mono text-[10px] md:text-xs font-bold text-gray-500 uppercase mt-1">SMART QUEUE • MEDIATECH AN-NUR II</p>
            </div>
        </div>
        <div class="flex gap-2 w-full md:w-auto">
            <button onclick="broadcastClearCache()" class="flex-1 md:flex-none neo-button bg-neoCyan font-bold uppercase py-2 px-3 text-xs tracking-wider">
                Wipe Cache
            </button>
            <button onclick="resetAllQueues()" class="flex-1 md:flex-none neo-button bg-neoRed font-bold uppercase py-2 px-3 text-xs tracking-wider">
                Reset Semua
            </button>
        </div>
    </header>

    <!-- COLUMNS -->
    <div id="admin-columns" class="grid grid-cols-1 md:grid-cols-3 gap-8 flex-1 items-start">
        <!-- Rendered via JS -->
    </div>

    <script>
        let backgrounds = [];
        let allQueues = [];
        const cardColors = ['bg-neoYellow', 'bg-neoPink', 'bg-neoGreen'];

        // Broadcast Channel for System Events
        const systemChannel = supabaseClient.channel('system-events', {
            config: { broadcast: { self: true } }
        });
        systemChannel.subscribe();

        async function broadcastClearCache() {
            if (!confirm("⚠️ PERINGATAN: Tombol ini akan menghapus paksa memori (cache) tiket di SEMUA HP pelanggan yang saat ini membuka web antrian.\n\nYakin ingin mereset cache pelanggan?")) return;
            
            await systemChannel.send({
                type: 'broadcast',
                event: 'clear_cache',
                payload: { action: 'wipe' }
            });
            alert("✅ Sinyal pembersihan cache telah disebarkan ke semua pelanggan!");
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadInitialData();
            subscribeToUpdates();
        });

        async function loadInitialData() {
            const { data: bgs, error: bgError } = await supabaseClient.from('backgrounds').select('*').order('id');
            if (bgError) return alert(bgError.message);
            backgrounds = bgs;

            await fetchQueues();
        }

        async function fetchQueues() {
            const { data: queues, error } = await supabaseClient
                .from('queues')
                .select('*')
                .in('status', ['menunggu', 'dipanggil', 'ditunda'])
                .order('created_at', { ascending: true });
            
            if (error) return alert(error.message);
            allQueues = queues;
            renderColumns();
        }

        function subscribeToUpdates() {
            supabaseClient.channel('admin-queues')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'queues' }, payload => {
                    fetchQueues();
                })
                .subscribe();
        }

        function renderColumns() {
            const container = document.getElementById('admin-columns');
            
            const currentlyCalledAnywhere = allQueues
                .filter(q => q.status === 'dipanggil')
                .map(q => q.nomor_antrian);

            container.innerHTML = backgrounds.map((bg, index) => {
                const bgQueues = allQueues.filter(q => q.background_id === bg.id);
                const currentCalled = bgQueues.find(q => q.status === 'dipanggil');
                const waitingList = bgQueues.filter(q => q.status === 'menunggu');
                const delayedList = bgQueues.filter(q => q.status === 'ditunda');
                
                const headerColor = cardColors[index % cardColors.length];

                return `
                <div class="neo-card flex flex-col h-full rounded-none">
                    <!-- Column Header -->
                    <div class="flex justify-between items-center p-4 border-b-4 border-black ${headerColor}">
                        <h2 class="text-2xl font-black uppercase tracking-tight">${bg.nama_background}</h2>
                        <span class="font-mono font-bold bg-white border-2 border-black px-2 py-1 shadow-[2px_2px_0px_0px_#000]">Antri: ${waitingList.length}</span>
                    </div>

                    <!-- CURRENT CALLED -->
                    <div class="p-6 text-center border-b-4 border-black bg-white">
                        <div class="font-mono text-sm font-bold uppercase mb-2">Sedang Dipanggil</div>
                        <div class="text-6xl font-black tracking-tighter ${currentCalled ? 'text-black' : 'text-gray-300'} mb-2">
                            ${currentCalled ? currentCalled.nomor_antrian : '--'}
                        </div>
                        ${currentCalled ? `
                            <div class="font-bold text-lg uppercase bg-black text-white py-1 mb-1">${currentCalled.nama_lengkap}</div>
                            <div class="font-mono font-bold border-2 border-black inline-block px-2">KLS: ${currentCalled.kelas} | FOTO: ${currentCalled.jumlah_foto}x</div>
                        ` : ''}
                    </div>

                    <!-- ACTIONS -->
                    <div class="p-4 grid grid-cols-3 gap-2 border-b-4 border-black bg-bgLight">
                        <button onclick="callNext(${bg.id})" ${waitingList.length === 0 ? 'disabled' : ''} 
                            class="neo-button col-span-3 bg-neoCyan font-black uppercase py-4 text-lg">
                            Panggil Berikutnya
                        </button>
                        
                        <button onclick="markCurrentAs('selesai', ${bg.id})" ${!currentCalled ? 'disabled' : ''}
                            class="neo-button bg-neoGreen font-bold uppercase py-2 text-sm">
                            Selesai
                        </button>
                        
                        <button onclick="markAsDelayed(${bg.id})" ${!currentCalled ? 'disabled' : ''}
                            class="neo-button bg-neoYellow font-bold uppercase py-2 text-sm">
                            Tunda
                        </button>

                        <button onclick="markCurrentAs('batal', ${bg.id})" ${!currentCalled ? 'disabled' : ''}
                            class="neo-button bg-white font-bold uppercase py-2 text-sm text-red-600">
                            Batal
                        </button>
                    </div>

                    <!-- DAFTAR DITUNDA -->
                    ${delayedList.length > 0 ? `
                    <div class="p-4 bg-neoYellow border-b-4 border-black">
                        <div class="font-mono text-sm font-bold uppercase mb-3 border-b-2 border-black pb-1">Daftar Ditunda (${delayedList.length})</div>
                        <div class="space-y-2">
                            ${delayedList.map(q => `
                                <div class="flex justify-between items-center p-2 bg-white border-2 border-black shadow-[2px_2px_0px_0px_#000]">
                                    <div>
                                        <div class="font-black">${q.nomor_antrian}</div>
                                        <div class="text-xs font-bold uppercase">${q.nama_lengkap}</div>
                                    </div>
                                    <button onclick="returnToQueue('${q.nomor_antrian}')" class="bg-black text-white px-3 py-1 font-bold text-xs uppercase neo-button hover:-translate-y-0.5 hover:-translate-x-0.5">
                                        Hadir
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}

                    <!-- WAITING LIST -->
                    <div class="flex-1 min-h-[200px] p-6 bg-white">
                        <div class="font-mono text-sm font-bold uppercase mb-4 border-b-2 border-black pb-2">Daftar Menunggu</div>
                        <div class="space-y-3 overflow-y-auto max-h-[300px] pr-2">
                            ${waitingList.length > 0 ? waitingList.map((q, idx) => {
                                const isBusy = currentlyCalledAnywhere.includes(q.nomor_antrian);
                                return `
                                <div class="flex flex-col p-3 border-2 border-black shadow-[2px_2px_0px_0px_#000] relative bg-white">
                                    <div class="flex justify-between items-center border-b-2 border-black pb-1 mb-1">
                                        <span class="font-black text-xl">${q.nomor_antrian}</span>
                                        <span class="font-mono font-bold bg-black text-white px-2 py-0.5">${q.jumlah_foto}x</span>
                                    </div>
                                    <div class="font-bold text-sm uppercase truncate" title="${q.nama_lengkap}">${q.nama_lengkap || '-'}</div>
                                    <div class="font-mono text-xs uppercase text-gray-600">${q.kelas || '-'}</div>
                                    
                                    ${isBusy ? `
                                        <div class="absolute inset-0 bg-white/90 backdrop-blur-[1px] flex flex-col items-center justify-center border-2 border-neoRed" style="z-index: 10;">
                                            <span class="font-black text-neoRed uppercase text-lg">SIBUK</span>
                                            <span class="font-mono text-xs font-bold text-center px-2">DI BACKGROUND LAIN</span>
                                        </div>
                                    ` : ''}
                                </div>
                                `
                            }).join('') : `
                                <div class="text-center py-4 font-mono font-bold text-gray-400 uppercase">Tidak ada antrian</div>
                            `}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function callNext(bgId) {
            const bgQueues = allQueues.filter(q => q.background_id === bgId);
            const currentCalled = bgQueues.find(q => q.status === 'dipanggil');
            
            const currentlyCalledAnywhere = allQueues
                .filter(q => q.status === 'dipanggil')
                .map(q => q.nomor_antrian);

            const nextWaiting = bgQueues.find(q => 
                q.status === 'menunggu' && !currentlyCalledAnywhere.includes(q.nomor_antrian)
            );

            if (!nextWaiting) {
                const anyWaiting = bgQueues.find(q => q.status === 'menunggu');
                if (anyWaiting) {
                    alert("Antrian berikutnya sedang sibuk berfoto di background lain. Sistem otomatis menunggunya. Belum ada antrian lain yang tersedia.");
                } else {
                    alert("Tidak ada antrian yang menunggu.");
                }
                return;
            }

            try {
                if (currentCalled) {
                    await supabaseClient.from('queues').update({ status: 'selesai' }).eq('id', currentCalled.id);
                }
                
                await supabaseClient.from('queues').update({ status: 'dipanggil' }).eq('id', nextWaiting.id);
            } catch(e) {
                console.error(e);
                alert("Gagal memanggil antrian");
            }
        }

        async function returnToQueue(nomor_antrian) {
            try {
                const { error } = await supabaseClient
                    .from('queues')
                    .update({ status: 'menunggu' })
                    .eq('nomor_antrian', nomor_antrian)
                    .eq('status', 'ditunda');
                if (error) throw error;
            } catch(e) {
                console.error(e);
                alert("Gagal mengembalikan antrian: " + e.message);
            }
        }

        async function markAsDelayed(bgId) {
            const currentCalled = allQueues.find(q => q.background_id === bgId && q.status === 'dipanggil');
            if (currentCalled) {
                try {
                    const { error } = await supabaseClient
                        .from('queues')
                        .update({ status: 'ditunda' })
                        .eq('nomor_antrian', currentCalled.nomor_antrian)
                        .in('status', ['menunggu', 'dipanggil']);
                    if (error) throw error;
                } catch(e) {
                    console.error("Error delaying status:", e);
                    alert("Gagal menunda antrian: " + e.message);
                }
            }
        }

        async function markCurrentAs(status, bgId) {
            const currentCalled = allQueues.find(q => q.background_id === bgId && q.status === 'dipanggil');
            if (currentCalled) {
                try {
                    const { error } = await supabaseClient.from('queues').update({ status: status }).eq('id', currentCalled.id);
                    if (error) throw error;
                } catch(e) {
                    console.error("Error updating status:", e);
                    alert("Gagal mengupdate status: " + e.message);
                }
            }
        }

        async function resetAllQueues() {
            if(!confirm("YAKIN INGIN MERESET SEMUA ANTRIAN? Semua nomor antrian akan dibatalkan dan hitungan kembali ke awal hari.")) return;

            try {
                const { error } = await supabaseClient
                    .from('queues')
                    .update({ status: 'batal' })
                    .neq('status', 'batal'); 

                if (error) throw error;
                alert("Antrian berhasil direset.");
            } catch(e) {
                console.error(e);
                alert("Gagal mereset: " + e.message);
            }
        }
    </script>
</body>
</html>
