<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Sekretariat - Photobooth</title>
    <meta name="description" content="Dashboard Kesekretariatan Sistem Antrian Photobooth Mediatech An-Nur II">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="shared/tailwind-config.js"></script>
    <link rel="stylesheet" href="shared/styles.css">
    <style>
        /* Sekretariat-specific styles */
        .payment-badge {
            transition: all 0.15s ease;
            cursor: pointer;
            user-select: none;
        }
        .payment-badge:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0px 0px #000;
        }
        .payment-badge:active {
            transform: translateY(1px);
            box-shadow: 0px 0px 0px 0px #000;
        }
        .stat-card {
            transition: all 0.15s ease;
        }
        .stat-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 10px 10px 0px 0px #000;
        }
        .table-row {
            transition: background-color 0.1s ease;
        }
        .table-row:hover {
            background-color: #fef9c3;
        }
        .called-card {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0%, 100% { box-shadow: 6px 6px 0px 0px #000; }
            50% { box-shadow: 8px 8px 0px 0px #fde047; }
        }
        .notes-input {
            transition: all 0.15s ease;
        }
        .notes-input:focus {
            box-shadow: 3px 3px 0px 0px #67e8f9;
            transform: translateY(-1px);
        }
        /* Responsive table scroll */
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .table-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .table-scroll::-webkit-scrollbar-track {
            background: #fff;
            border-top: 2px solid #000;
        }
        .table-scroll::-webkit-scrollbar-thumb {
            background: #000;
        }
    </style>
</head>

<body class="flex flex-col min-h-screen">

    <!-- Load shared modules -->
    <script src="shared/config.js"></script>
    <script src="shared/ui.js"></script>
    <script src="js/auth.js"></script>

    <!-- CUSTOM POPUP MODAL -->
    <div id="custom-popup" class="fixed inset-0 bg-black/60 backdrop-blur-[2px] z-[100] flex items-center justify-center p-4 hidden transition-opacity duration-200">
        <div class="bg-white border-4 border-black shadow-[8px_8px_0px_0px_#000] p-6 max-w-md w-full transform transition-all duration-300 scale-95 opacity-0" id="popup-content">
            <h2 id="popup-title" class="text-xl font-black uppercase tracking-tight border-b-4 border-black pb-1 mb-4 inline-block pr-4">Perhatian</h2>
            <div id="popup-body" class="font-bold mb-6 text-sm leading-relaxed"></div>
            <div id="popup-actions" class="flex gap-3">
                <button onclick="closePopup()" class="flex-1 bg-black text-white font-black uppercase px-4 py-3 hover:bg-neoCyan hover:text-black transition-colors border-4 border-black shadow-[4px_4px_0px_0px_#000]">TUTUP</button>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="p-3 md:p-4 flex flex-col xl:flex-row justify-between items-start xl:items-center border-b-4 border-black bg-white shrink-0 shadow-[0px_4px_0px_0px_#000] z-20 gap-4">
        <div class="flex items-center gap-3 md:gap-4">
            <img src="logo-mm.png" alt="Logo" class="h-8 md:h-12 hidden sm:block">
            <div>
                <h1 class="text-2xl md:text-4xl font-black uppercase tracking-tighter leading-none flex items-center gap-2 text-black">
                    <img src="logo-mm.png" alt="Logo" class="h-6 sm:hidden">
                    Sekretariat
                </h1>
                <p class="font-mono text-[10px] md:text-sm font-bold text-black bg-neoPink border-2 border-black px-1 inline-block uppercase mt-0.5">
                    Photobooth Mediatech An-Nur II</p>
            </div>
        </div>
        <div class="grid grid-cols-2 sm:flex sm:flex-wrap gap-2 w-full xl:w-auto items-center">
            <!-- Booth Selector -->
            <div class="col-span-2 flex gap-2">
                <select id="booth-selector" onchange="switchBooth(this.value)"
                    class="flex-1 neo-button bg-black text-white font-bold py-2 px-3 text-sm uppercase outline-none cursor-pointer">
                    <option value="all">Semua Booth</option>
                </select>
            </div>
            <a href="admin.html"
                class="w-full sm:w-auto neo-button bg-neoYellow font-bold uppercase py-2 md:py-3 px-3 md:px-6 text-xs md:text-sm text-center">📺 Dashboard Antrian</a>
            <button onclick="exportData()"
                class="w-full sm:w-auto neo-button bg-neoYellow font-bold uppercase py-2 md:py-3 px-3 md:px-6 text-xs md:text-sm">JSON</button>
            <button onclick="document.getElementById('import-file').click()"
                class="w-full sm:w-auto neo-button bg-neoPink font-bold uppercase py-2 md:py-3 px-3 md:px-6 text-xs md:text-sm">Import</button>
            <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
            <button onclick="exportCSV()"
                class="w-full sm:w-auto neo-button bg-neoGreen font-bold uppercase py-2 md:py-3 px-3 md:px-6 text-xs md:text-sm">📊 CSV</button>
            <button onclick="downloadPDF()"
                class="w-full sm:w-auto neo-button bg-neoCyan font-bold uppercase py-2 md:py-3 px-3 md:px-6 text-xs md:text-sm">📄 PDF</button>
            <button onclick="broadcastClearCache()"
                class="w-full sm:w-auto neo-button bg-neoCyan font-bold uppercase py-2 md:py-3 px-3 md:px-6 text-xs md:text-sm">Wipe Cache</button>
            <button onclick="resetAllQueues()"
                class="w-full sm:w-auto neo-button bg-neoRed font-bold uppercase py-2 md:py-3 px-3 md:px-6 text-xs md:text-sm">Reset Booth</button>
            <button onclick="logout()"
                class="col-span-2 sm:col-span-1 sm:w-auto neo-button bg-white font-bold uppercase py-2 md:py-3 px-3 md:px-6 text-xs md:text-sm border-2 border-black">🔒 Logout</button>
        </div>
    </header>

    <!-- BOOTH MANAGEMENT PANEL -->
    <div class="border-b-4 border-black bg-bgLight shrink-0">
        <div class="max-w-[1920px] mx-auto">
            <!-- Toggle Button -->
            <button onclick="document.getElementById('booth-panel').classList.toggle('hidden')"
                class="w-full p-3 font-mono font-bold uppercase text-sm flex items-center justify-between gap-2 hover:bg-neoYellow transition-colors border-b-2 border-black">
                <span>⚙️ Manajemen Booth (Tambah / Edit / Hapus)</span>
                <span class="text-xs">▼ klik untuk buka/tutup</span>
            </button>
            <div id="booth-panel" class="hidden p-4 md:p-6 space-y-4">
                <!-- Tambah Booth Baru -->
                <div class="flex flex-wrap gap-2 items-end p-4 border-4 border-black bg-white shadow-[4px_4px_0px_0px_#000]">
                    <div class="flex flex-col gap-1">
                        <label class="font-mono text-xs font-bold uppercase">Nama Booth Baru</label>
                        <input type="text" id="new-booth-name" placeholder="cth: Booth Aula A"
                            class="border-2 border-black px-3 py-2 font-bold focus:outline-none focus:ring-2 focus:ring-neoCyan w-48">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="font-mono text-xs font-bold uppercase">Prefix Tiket</label>
                        <input type="text" id="new-booth-prefix" placeholder="cth: AUA" maxlength="5"
                            class="border-2 border-black px-3 py-2 font-bold uppercase focus:outline-none focus:ring-2 focus:ring-neoCyan w-24">
                    </div>
                    <button onclick="addBooth()"
                        class="neo-button bg-neoCyan font-black uppercase py-2 px-6 text-sm">+ Tambah Booth</button>
                </div>
                <!-- Daftar Booth -->
                <div id="booth-management-list" class="space-y-2">
                    <!-- Rendered via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- BACKGROUND MANAGEMENT PANEL -->
    <div class="border-b-4 border-black bg-white shrink-0">
        <div class="max-w-[1920px] mx-auto">
            <button onclick="document.getElementById('bg-panel').classList.toggle('hidden')"
                class="w-full p-3 font-mono font-bold uppercase text-sm flex items-center justify-between gap-2 hover:bg-neoCyan transition-colors border-b-2 border-black">
                <span>🖼️ Buka / Kunci Background</span>
                <span class="text-xs">▼ klik untuk buka/tutup</span>
            </button>
            <div id="bg-panel" class="hidden p-4 md:p-6">
                <div id="background-toggle-list" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                    <!-- Rendered via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- USER MANAGEMENT PANEL -->
    <div class="border-b-4 border-black bg-white shrink-0">
        <div class="max-w-[1920px] mx-auto">
            <!-- Toggle Button -->
            <button onclick="document.getElementById('user-panel').classList.toggle('hidden')"
                class="w-full p-3 font-mono font-bold uppercase text-sm flex items-center justify-between gap-2 hover:bg-neoPink transition-colors border-b-2 border-black">
                <span>👥 Manajemen User (Akses & Role)</span>
                <span class="text-xs">▼ klik untuk buka/tutup</span>
            </button>
            <div id="user-panel" class="hidden p-4 md:p-6 space-y-4">
                
                <!-- Form Tambah Akun -->
                <div class="border-4 border-black p-4 bg-neoYellow shadow-[4px_4px_0px_0px_#000] space-y-3">
                    <h3 class="font-black uppercase text-sm border-b-2 border-black pb-1">➕ Buat Akun Baru</h3>
                    <form id="form-create-user" onsubmit="handleCreateUser(event)" class="flex flex-col md:flex-row gap-3 items-end">
                        <div class="flex-1 w-full flex flex-col gap-1">
                            <label class="font-mono text-xs font-bold uppercase">Nama</label>
                            <input type="text" id="new-user-name" required placeholder="Cth: Staf Budi" class="border-2 border-black px-3 py-2 font-bold focus:outline-none focus:ring-2 focus:ring-neoCyan w-full">
                        </div>
                        <div class="flex-1 w-full flex flex-col gap-1">
                            <label class="font-mono text-xs font-bold uppercase">Email</label>
                            <input type="email" id="new-user-email" required placeholder="budi@email.com" class="border-2 border-black px-3 py-2 font-bold focus:outline-none focus:ring-2 focus:ring-neoCyan w-full">
                        </div>
                        <div class="flex-1 w-full flex flex-col gap-1">
                            <label class="font-mono text-xs font-bold uppercase">Password</label>
                            <input type="text" id="new-user-password" required minlength="6" placeholder="Minimal 6 karakter" class="border-2 border-black px-3 py-2 font-bold focus:outline-none focus:ring-2 focus:ring-neoCyan w-full">
                        </div>
                        <div class="flex-1 w-full flex flex-col gap-1">
                            <label class="font-mono text-xs font-bold uppercase">Role</label>
                            <select id="new-user-role" class="border-2 border-black px-3 py-2 font-bold focus:outline-none focus:ring-2 focus:ring-neoCyan w-full bg-white">
                                <option value="foto">Fotografer</option>
                                <option value="pengambilan">Pengambilan</option>
                                <option value="admin">Admin / Sekretariat</option>
                            </select>
                        </div>
                        <button type="submit" id="btn-submit-user" class="neo-button bg-black text-white font-black uppercase py-2 px-6 text-sm h-10 w-full md:w-auto">Buat Akun</button>
                    </form>
                </div>

                <!-- Daftar User -->
                <div id="user-management-list" class="space-y-3">
                    <!-- Rendered via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 w-full max-w-[1920px] mx-auto p-4 md:p-6 z-10 flex flex-col gap-6">

        <!-- PANEL: SEDANG DIPANGGIL / MASUK -->
        <section>
            <div class="flex items-center gap-3 mb-3">
                <div class="h-1 flex-1 bg-black"></div>
                <h2 class="font-mono text-xs md:text-sm font-bold uppercase bg-neoYellow border-2 border-black px-3 py-1 shadow-[3px_3px_0px_0px_#000]">
                    📢 Sedang Masuk / Dipanggil
                </h2>
                <div class="h-1 flex-1 bg-black"></div>
            </div>
            <div id="called-panel" class="flex flex-row gap-3 items-stretch">
                <!-- Rendered via JS -->
                <div class="font-mono font-bold text-gray-400 uppercase py-4">Memuat...</div>
            </div>
        </section>

        <!-- EXTRA STATS CARDS (Backgrounds & Pigura) -->
        <section id="extra-stats-section" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
            <!-- Rendered via JS -->
        </section>

        <!-- STATS CARDS -->
        <section id="stats-section" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
            <!-- Rendered via JS -->
        </section>

        <!-- SEARCH & FILTER -->
        <section class="flex flex-col sm:flex-row gap-3">
            <div class="flex-1">
                <input type="text" id="search-input" placeholder="🔍 Cari nama, tiket, kelas..."
                    class="w-full border-3 border-black p-3 font-bold bg-white focus:outline-none focus:ring-4 focus:ring-neoCyan transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] focus:translate-y-[2px]"
                    oninput="debounceSearch(this.value)">
            </div>
            <select id="filter-payment" onchange="applyFilters()"
                class="neo-button bg-white font-bold py-2 px-4 text-sm uppercase outline-none cursor-pointer">
                <option value="all">Semua Status</option>
                <option value="belum_lunas">❌ Belum Lunas</option>
                <option value="lunas">✅ Lunas</option>
            </select>
            <select id="filter-status" onchange="applyFilters()"
                class="neo-button bg-white font-bold py-2 px-4 text-sm uppercase outline-none cursor-pointer">
                <option value="all">Semua Antrian</option>
                <option value="active">⏳ Aktif (Menunggu/Dipanggil)</option>
                <option value="selesai">✅ Selesai</option>
                <option value="batal">❌ Batal</option>
            </select>
        </section>

        <!-- CUSTOMER TABLE -->
        <section class="border-4 border-black bg-white shadow-[8px_8px_0px_0px_#000]">
            <div class="bg-neoPink border-b-4 border-black p-3 flex justify-between items-center">
                <h2 class="font-black uppercase tracking-tight text-lg md:text-xl">Data Customer</h2>
                <span id="table-count" class="font-mono font-bold bg-white border-2 border-black px-3 py-1 text-sm shadow-[2px_2px_0px_0px_#000]">0 data</span>
            </div>
            <div class="table-scroll">
                <table class="w-full text-left min-w-[900px]">
                    <thead>
                        <tr class="border-b-4 border-black bg-bgLight">
                            <th class="p-3 font-mono text-xs font-bold uppercase w-10">No</th>
                            <th class="p-3 font-mono text-xs font-bold uppercase">Tiket</th>
                            <th class="p-3 font-mono text-xs font-bold uppercase">Booth</th>
                            <th class="p-3 font-mono text-xs font-bold uppercase">Nama</th>
                            <th class="p-3 font-mono text-xs font-bold uppercase">Kelas</th>
                            <th class="p-3 font-mono text-xs font-bold uppercase">Alamat</th>
                            <th class="p-3 font-mono text-xs font-bold uppercase">Pembelian</th>
                            <th class="p-3 font-mono text-xs font-bold uppercase text-right">Total</th>
                            <th class="p-3 font-mono text-xs font-bold uppercase text-center">Bayar</th>
                            <th class="p-3 font-mono text-xs font-bold uppercase">Catatan</th>
                            <th class="p-3 font-mono text-xs font-bold uppercase text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="customer-table-body">
                        <!-- Rendered via JS -->
                        <tr>
                            <td colspan="11" class="text-center font-mono font-bold text-gray-400 uppercase py-8">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- EDIT MODAL -->
    <div id="edit-modal" class="fixed inset-0 bg-black/60 backdrop-blur-[2px] z-[90] flex items-center justify-center p-4 hidden transition-opacity duration-200">
        <div class="bg-white border-4 border-black shadow-[8px_8px_0px_0px_#000] p-6 max-w-md w-full transform transition-all duration-300 scale-95 opacity-0" id="edit-modal-content">
            <h2 class="text-xl font-black uppercase tracking-tight border-b-4 border-black pb-1 mb-4 inline-block pr-4 bg-neoCyan">Edit Customer</h2>
            
            <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                <input type="hidden" id="edit-nomor-antrian">
                <div>
                    <label class="font-mono text-xs font-bold uppercase block mb-1">Nama Lengkap</label>
                    <input type="text" id="edit-nama"
                        class="w-full border-2 border-black p-3 font-bold focus:outline-none focus:ring-2 focus:ring-neoCyan">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="font-mono text-xs font-bold uppercase block mb-1">Kelas</label>
                        <input type="text" id="edit-kelas"
                            class="w-full border-2 border-black p-3 font-bold focus:outline-none focus:ring-2 focus:ring-neoCyan">
                    </div>
                    <div>
                        <label class="font-mono text-xs font-bold uppercase block mb-1">Alamat</label>
                        <input type="text" id="edit-alamat"
                            class="w-full border-2 border-black p-3 font-bold focus:outline-none focus:ring-2 focus:ring-neoCyan">
                    </div>
                </div>
                <div>
                    <label class="font-mono text-xs font-bold uppercase block mb-1">No. WhatsApp</label>
                    <input type="tel" id="edit-wa"
                        class="w-full border-2 border-black p-3 font-bold focus:outline-none focus:ring-2 focus:ring-neoCyan"
                        placeholder="081234567890">
                </div>
                <div>
                    <label class="font-mono text-xs font-bold uppercase block mb-1">Catatan</label>
                    <textarea id="edit-notes" rows="2"
                        class="w-full border-2 border-black p-3 font-bold focus:outline-none focus:ring-2 focus:ring-neoCyan resize-none"
                        placeholder="Catatan tambahan..."></textarea>
                </div>
                
                <div class="h-1 bg-black w-full my-4"></div>
                <div class="font-mono text-xs font-bold uppercase block mb-2 bg-neoYellow inline-block px-2 border-2 border-black">Ubah Pesanan</div>
                
                <div id="edit-bg-list" class="space-y-2">
                    <div class="text-center font-mono text-xs font-bold text-gray-500">Memuat pilihan...</div>
                </div>
                
                <div class="bg-white border-2 border-black p-2 flex justify-between items-center mt-2">
                    <div class="font-black uppercase text-sm">Pigura</div>
                    <div class="flex items-center bg-white border-2 border-black rounded-full overflow-hidden shrink-0 h-8">
                        <button type="button" onclick="changeEditPiguraQty(-1)" class="w-8 h-full bg-white hover:bg-gray-200 font-black flex items-center justify-center transition-colors border-r-2 border-black">-</button>
                        <span id="edit-qty-pigura" class="font-mono font-black text-sm w-8 text-center flex items-center justify-center bg-white h-full">0</span>
                        <button type="button" onclick="changeEditPiguraQty(1)" class="w-8 h-full bg-white hover:bg-gray-200 font-black flex items-center justify-center transition-colors border-l-2 border-black">+</button>
                    </div>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button onclick="closeEditModal()"
                    class="flex-1 bg-white text-black font-black uppercase px-4 py-3 hover:bg-gray-200 transition-colors border-4 border-black shadow-[4px_4px_0px_0px_#000]">BATAL</button>
                <button onclick="saveCustomerEdit()"
                    class="flex-1 bg-neoGreen text-black font-black uppercase px-4 py-3 hover:bg-black hover:text-white transition-colors border-4 border-black shadow-[4px_4px_0px_0px_#000]">SIMPAN</button>
            </div>
        </div>
    </div>

    <!-- Load page-specific logic -->
    <script src="js/sekretariat.js"></script>
</body>

</html>
