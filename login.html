<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Photobooth</title>
    <meta name="description" content="Login ke Dashboard Admin Sistem Antrian Photobooth Mediatech An-Nur II">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="shared/tailwind-config.js"></script>
    <link rel="stylesheet" href="shared/styles.css">
</head>

<body class="flex items-center justify-center min-h-screen p-4">

    <script src="shared/config.js"></script>
    <script src="js/auth.js"></script>

    <div class="neo-card p-0 text-center max-w-sm w-full mx-auto relative bg-white flex flex-col overflow-hidden">

        <!-- Top Banner -->
        <div
            class="w-full p-4 border-b-4 border-black bg-neoYellow text-black text-center shadow-[0px_4px_0px_0px_#000] z-10 relative">
            <div class="flex items-center justify-center gap-2 mb-1">
                <img src="logo-mm.png" alt="Logo" class="h-6">
                <span class="font-black text-xs uppercase leading-none tracking-widest text-left">Mediatech<br>An-Nur
                    II</span>
            </div>
            <h1 class="text-3xl font-black uppercase mt-2 tracking-tighter">Login Admin</h1>
        </div>

        <div class="p-6 space-y-5 relative z-0">

            <p class="font-mono text-sm font-bold border-b-2 border-black pb-2 inline-block mx-auto uppercase">
                Masuk ke Dashboard
            </p>

            <!-- Error Message -->
            <div id="login-error"
                class="hidden bg-neoRed border-3 border-black p-3 font-bold text-sm text-center shadow-[3px_3px_0px_0px_#000]">
            </div>

            <div class="space-y-4 text-left">
                <div>
                    <label class="font-mono text-sm font-bold uppercase block mb-2 text-gray-700">Email</label>
                    <input type="email" id="input-email"
                        class="w-full border-3 border-black p-4 text-lg font-bold bg-white focus:outline-none focus:ring-4 focus:ring-neoCyan transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] focus:translate-y-[2px]"
                        placeholder="admin@email.com"
                        onkeydown="if(event.key === 'Enter') document.getElementById('input-password').focus()">
                </div>
                <div>
                    <label class="font-mono text-sm font-bold uppercase block mb-2 text-gray-700">Password</label>
                    <input type="password" id="input-password"
                        class="w-full border-3 border-black p-4 text-lg font-bold bg-white focus:outline-none focus:ring-4 focus:ring-neoCyan transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] focus:translate-y-[2px]"
                        placeholder="••••••••"
                        onkeydown="if(event.key === 'Enter') handleLogin()">
                </div>
            </div>

            <button onclick="handleLogin()" id="btn-login"
                class="w-full mt-4 bg-neoCyan text-black hover:bg-black hover:text-white font-black py-5 uppercase tracking-widest text-xl border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:translate-y-[4px] transition-all">
                MASUK
            </button>

            <a href="index.html"
                class="block text-center font-mono text-xs font-bold uppercase mt-4 hover:text-neoCyan transition-colors underline underline-offset-4">
                ← Kembali ke Portal
            </a>
        </div>
    </div>

    <script>
        // If already logged in, redirect to respective dashboard
        (async () => {
            const session = await getSession();
            if (session) {
                const profile = await getUserProfile(session.user.id);
                const role = profile ? profile.role : 'foto';
                window.location.href = getRedirectByRole(role);
            }
        })();

        async function handleLogin() {
            const email = document.getElementById('input-email').value.trim();
            const password = document.getElementById('input-password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('btn-login');

            if (!email || !password) {
                errorEl.textContent = 'Harap isi Email dan Password.';
                errorEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'MEMPROSES...';
            errorEl.classList.add('hidden');

            const result = await loginWithEmail(email, password);

            if (result.success) {
                window.location.href = getRedirectByRole(result.role);
            } else {
                errorEl.textContent = 'Login gagal: ' + result.error;
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'MASUK';
            }
        }
    </script>
</body>

</html>
